<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Home Budget{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <div class="wrap nav">
      <strong class="brand">Home Budget</strong>
      <nav>
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <a href="{{ url_for('transactions') }}">Transactions</a>
        <a href="{{ url_for('categories') }}">Categories</a>
        <a href="{{ url_for('budgets') }}">Budgets</a>
        <a href="{{ url_for('reports') }}">Reports</a>
        <a href="{{ url_for('import_transactions') }}">Import / Export</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
