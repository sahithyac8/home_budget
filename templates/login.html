{% extends "base.html" %}
{% block title %}Log in - Home Budget{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <h1>Welcome back</h1>
    <p class="muted">Log in to see your dashboard.</p>
    {% if error %}<div class="flash error" role="alert">{{ error }}</div>{% endif %}
    <form method="post" class="stack">
      {% if next_url %}<input type="hidden" name="next" value="{{ next_url }}">{% endif %}
      <label>Email
        <input type="email" name="email" value="{{ email }}" required autocomplete="email" autofocus>
      </label>
      <label>Password
        <input type="password" name="password" required autocomplete="current-password">
      </label>
      <button class="btn-wide" type="submit">Log in</button>
    </form>
    <p class="auth-switch">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
  </div>
</div>
{% endblock %}
